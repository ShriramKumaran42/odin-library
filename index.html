<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Library on-the-go</h1>
        </div>
        <div class="main">
            <div class="adder">
                <h3>Add a new book</h3>
                <div>
                    <button id="showDialog" class="btn" aria-label="Add a New Book">+</button>
                </div>
                <output>

                </output>
            </div>
            <dialog id="addDialog" role="dialog" aria-label="dialog-title">
                <form>
                    <p>
                        <h2 id="dialog-title">Add a new Book</h2>
                        <label for="title">
                            Name of the book : 
                        </label>
                        <input type="text" id="title" name="title">
                        <span id="name-error" aria-live="polite"></span>
                        <br><br>
                        <label for="author">
                            Author of the book : 
                        </label>
                        <input type="text" id="author" name="author">
                        <span id="author-error" aria-live="polite"></span>
                        <br><br>
    
                        <label for="pages">
                            No of pages : 
                        </label>
                        <input type="number" id="pages" name="pages">
                        <span id="pages-error" aria-live="polite"></span>
                        <br><br>
                        <label>
                            Have you read : 
                            <input type="checkbox" id="read" checked>
                        </label>
                        <div class="dialog-button">
                            <button value="cancel" formmethod="dialog" class="cancel" id="cancel">Cancel</button>
                            <button id="confirmBtn" value="default">+</button>
                        </div>
                    </p>
                </form>
            </dialog>
        </div>
        
    </div>
</body>
</html>
